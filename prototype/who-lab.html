<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <title>Who is it? lab</title>
  <meta name="description" content="Teacher preview: the «Who is it?» step of Unit 1.1 Lesson 2 in each speech-bubble layout.">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <style>
    :root { --ink: #2c2118; --soft: #6b5a4b; --cream: #fff9f0; --sand: #eadfcf; --teal: #0b7d79; --teal-50: #e3f6f5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); color: var(--ink); font: 16px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif; }
    main { max-width: 1400px; margin: 0 auto; padding: 16px; }
    h1 { font: 700 1.6rem/1.2 Fredoka, system-ui, sans-serif; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: var(--soft); max-width: 70ch; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin: 12px 0 16px; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .group b { font: 600 0.95rem Fredoka, system-ui, sans-serif; margin-right: 4px; }
    button { font: 600 1rem Fredoka, system-ui, sans-serif; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--sand); background: #fff; color: var(--ink); cursor: pointer; }
    button[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-50); color: var(--teal); }
    button:focus-visible { outline: 3px solid #d6247a; outline-offset: 2px; }
    .stage { display: flex; justify-content: center; }
    .frame { border: 2px solid var(--sand); border-radius: 18px; overflow: hidden; background: #fff; max-width: 100%; }
    iframe { display: block; border: 0; }
    .open { display: inline-block; margin-top: 10px; color: var(--teal); font-weight: 700; }
  </style>
</head>
<body>
<main>
  <h1>«Who is it?» lab</h1>
  <p>The picture-choice step of Unit 1.1, Lesson 2, in each speech-bubble layout. Pick a layout, a step and a screen size; the lesson opens at that step. In the app itself, add <code>?whoLayout=a</code>, <code>b</code>, <code>c</code> or <code>plain</code> to the address.</p>
  <div class="bar">
    <div class="group" role="group" aria-label="Layout"><b>Layout</b>
      <button data-k="layout" data-v="a">A · Max tells you</button>
      <button data-k="layout" data-v="b">B · Two bubbles</button>
      <button data-k="layout" data-v="c">C · Spot the word</button>
      <button data-k="layout" data-v="plain">Old (plain cards)</button>
    </div>
    <div class="group" role="group" aria-label="Step"><b>Step</b>
      <button data-k="step" data-v="who-el">“he” (who-el)</button>
      <button data-k="step" data-v="who-ella">“she” (who-ella)</button>
    </div>
    <div class="group" role="group" aria-label="Screen"><b>Screen</b>
      <button data-k="size" data-v="390x844">Phone 390×844</button>
      <button data-k="size" data-v="375x667">Small phone 375×667</button>
      <button data-k="size" data-v="1280x800">Laptop 1280×800</button>
    </div>
  </div>
  <div class="stage"><div class="frame"><iframe title="Lesson preview"></iframe></div></div>
  <a class="open" target="_blank" rel="noopener">Open this one full screen ↗</a>
</main>
<script>
  const state = { layout: "a", step: "who-el", size: "390x844" };
  try { Object.assign(state, Object.fromEntries(new URLSearchParams(location.search))); } catch { /* ignore */ }
  const frame = document.querySelector("iframe"), open = document.querySelector(".open");
  function show() {
    document.querySelectorAll("[data-k]").forEach((b) => b.setAttribute("aria-pressed", String(state[b.dataset.k] === b.dataset.v)));
    const [w, h] = state.size.split("x").map(Number);
    const scale = Math.min(1, (innerWidth - 36) / w);
    frame.width = w; frame.height = h;
    frame.style.width = w + "px"; frame.style.height = h + "px";
    frame.style.transform = scale < 1 ? `scale(${scale})` : "";
    frame.style.transformOrigin = "top left";
    frame.parentElement.style.width = w * scale + 4 + "px"; frame.parentElement.style.height = h * scale + 4 + "px";
    const url = `index.html?unlock=all&whoLayout=${state.layout}&step=${state.step}#/lesson/1.1-2`;
    frame.src = url; open.href = url;
    try { history.replaceState(null, "", `?layout=${state.layout}&step=${state.step}&size=${state.size}`); } catch { /* file:// */ }
  }
  document.addEventListener("click", (e) => { const b = e.target.closest("[data-k]"); if (!b) return; state[b.dataset.k] = b.dataset.v; show(); });
  addEventListener("resize", () => { clearTimeout(show.t); show.t = setTimeout(show, 200); });
  show();
</script>
</body>
</html>
