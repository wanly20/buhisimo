<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buhísimo</title>
<style>
  :root { --bg: #fffaf2; --ink: #2b2118; --accent: #0fb5ae; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1915; --ink: #f6efe6; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font-family: system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  h1 { font-size: clamp(2.5rem, 10vw, 4rem); margin: 0; color: var(--accent); }
  p { font-size: 1.25rem; max-width: 30ch; margin: 12px auto 0; }
</style>
</head>
<body>
  <main>
    <h1>Buhísimo</h1>
    <p>¡Muy pronto! The new Buhísimo is on its way.</p>
  </main>
</body>
</html>
